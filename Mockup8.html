<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación de Email</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .box {
      border: 1px solid #000;
      padding: 2rem;
      max-width: 400px;
      margin: 2rem auto;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .panel-box {
      border: 1px solid #000;
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 0;
    }
    .success { background-color: #d5e8d4; border-color: #82b366; }
    .error { background-color: #f8d7da; border-color: #c9302c; }
    .warning { background-color: #fff3cd; border-color: #856404; }
  </style>
</head>
<body>
  <div class="container">

    <!-- Formulario de Email -->
    <div class="box">
      <h3 class="text-center">Validación de Email</h3>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="cliente@example.com">
      </div>
      <button id="btnValidar" class="btn btn-primary w-100">Validar</button>
    </div>

    <!-- Escenarios -->
    <div id="email-valido" class="panel-box success" style="display:none;">
      <h5>Email válido</h5>
      <p>Registro continúa</p>
    </div>

    <div id="email-invalido" class="panel-box error" style="display:none;">
      <h5>Email inválido</h5>
      <p>Registro bloqueado</p>
    </div>

    <div id="api-no-disponible" class="panel-box warning" style="display:none;">
      <h5>API no disponible</h5>
      <p>Servicio de validación no disponible</p>
    </div>

  </div>

  <script>
    const btnValidar = document.getElementById('btnValidar');

    btnValidar.addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();

      // Ocultar todos los escenarios
      document.getElementById('email-valido').style.display = 'none';
      document.getElementById('email-invalido').style.display = 'none';
      document.getElementById('api-no-disponible').style.display = 'none';

      // Simulación de API
      if(email === "cliente@example.com") {
        document.getElementById('email-valido').style.display = 'block';
      } else if(email === "maria@example.com") {
        document.getElementById('api-no-disponible').style.display = 'block';
      } else {
        // Escenario 2: Email inválido
        document.getElementById('email-invalido').style.display = 'block';
      }
    });
  </script>

</body>
</html>
